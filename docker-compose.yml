name: ruleengine-fullstack

services:
  postgres:
    image: postgres:latest
    container_name: ruleengine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ruleengine}
      POSTGRES_USER: ${POSTGRES_USER:-ruleengine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ruleengine}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-4567}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ruleengine-network

  redis:
    image: redis:latest
    container_name: ruleengine-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-7856}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ruleengine-network

  backend:
    build:
      context: ./ruleengine
      dockerfile: Dockerfile
    image: ruleengine-backend:local
    container_name: ruleengine-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 3600
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ruleengine}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ruleengine}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ruleengine}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ""
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3100,http://localhost:5173}
    ports:
      - "3600:3600"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ruleengine-network

  frontend:
    build:
      context: ./rule-engine-frontend
      dockerfile: Dockerfile
    image: ruleengine-frontend:local
    container_name: ruleengine-frontend
    restart: unless-stopped
    ports:
      - "3100:3100"
    depends_on:
      - backend
    networks:
      - ruleengine-network

volumes:
  postgres_data:
  redis_data:

networks:
  ruleengine-network:
    driver: bridge
