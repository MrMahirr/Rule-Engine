server:
  port: ${SERVER_PORT:3500}

spring:
  application:
    name: ruleengine
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:4567/ruleengine}
    username: ${SPRING_DATASOURCE_USERNAME:ruleengine}
    password: ${SPRING_DATASOURCE_PASSWORD:ruleengine}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:7856}
      password: ${SPRING_REDIS_PASSWORD:}
      repositories:
        enabled: false
  cache:
    type: redis
    redis:
      time-to-live: ${SPRING_CACHE_TTL:10m}
      cache-null-values: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
